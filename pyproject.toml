[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colombus"
version = "0.1.0"
description = "Browse films from your terminal."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
    "rich>=13.7",
    "pillow>=10.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
posters = ["textual-image>=0.6"]

[project.scripts]
colombus = "main:main"

[tool.setuptools]
py-modules = ["app", "cache", "config", "main", "models", "render", "service"]

[tool.setuptools.packages.find]
include = ["sources*", "widgets*"]
