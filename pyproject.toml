[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colombus"
version = "0.1.0"
description = "Terminal UI for browsing movie details, ratings and reviews."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
    "rich>=13.7",
    "pillow>=10.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
# Kitty graphics protocol / Sixel poster rendering.
posters = ["textual-image>=0.6"]

[tool.setuptools]
py-modules = ["app", "cache", "config", "main", "models", "render", "service"]
packages = ["sources", "widgets"]
